name: povod
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://povod:povod-local-only@postgres:5432/povod
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_API_TOKEN: ${TBANK_API_TOKEN:-}
      TBANK_API_BASE_URL: ${TBANK_API_BASE_URL:-https://securepay.tinkoff.ru/v2}
      TBANK_WEBHOOK_SECRET: ${TBANK_WEBHOOK_SECRET:-}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:-}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-600}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_TIMEOUT_SECONDS: ${DATABASE_TIMEOUT_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CAMPAIGN_RATE_LIMIT_PER_SECOND: ${CAMPAIGN_RATE_LIMIT_PER_SECOND:-25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: povod
      POSTGRES_PASSWORD: povod-local-only
      POSTGRES_DB: povod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U povod -d povod"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
