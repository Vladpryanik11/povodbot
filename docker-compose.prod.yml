# Сервер: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Секреты и домен берутся из .env на сервере (шаблон — deploy/server.env.example).
name: povod
x-app: &app
  image: povod-app
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgresql+asyncpg://povod:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/povod
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
services:
  # Разовая задача: применяет миграции и завершается. Остальные сервисы ждут её.
  migrate:
    image: povod-app
    build: .
    restart: "no"
    env_file: .env
    environment: *app-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    volumes:
      - media:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Бот работает через polling: запускать только ОДИН экземпляр.
  bot:
    <<: *app
    command: ["python", "-m", "src.bot.main"]
  worker:
    <<: *app
    command: ["python", "-m", "src.workers.main"]
  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: povod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: povod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U povod -d povod"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
