name: Foundation checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: povod
          POSTGRES_PASSWORD: povod-test-only
          POSTGRES_DB: povod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U povod -d povod_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://povod:povod-test-only@localhost:5432/povod_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python scripts/check_secrets.py
      - run: docker compose config --quiet
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
